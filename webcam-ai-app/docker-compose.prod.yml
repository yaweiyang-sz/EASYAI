version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: camera-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - camera-data:/app/data
    restart: unless-stopped
    networks:
      - camera-ai-network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: camera-ai-service
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ai-models:/root/.cache/torch
    restart: unless-stopped
    networks:
      - camera-ai-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: camera-ai-frontend
    restart: unless-stopped
    networks:
      - camera-ai-network

  nginx:
    image: nginx:alpine
    container_name: camera-ai-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/var/www/camera-ai/frontend/dist:ro
    depends_on:
      - backend
      - ai-service
    restart: unless-stopped
    networks:
      - camera-ai-network

volumes:
  camera-data:
  ai-models:

networks:
  camera-ai-network:
    driver: bridge